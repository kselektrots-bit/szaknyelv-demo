<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23FF6B35' width='100' height='100'/><text x='50' y='75' font-size='80' font-weight='bold' fill='white' text-anchor='middle'>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Villanyszerelő Szókincs PRO" />
    <meta name="theme-color" content="#FF6B35" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VillanyEdu" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23FF6B35' width='180' height='180' rx='40'/><text x='90' y='130' font-size='120' font-weight='bold' fill='white' text-anchor='middle'>⚡</text></svg>" />
    <link rel="manifest" href="/manifest.json" />
    <title>Villanyszerelő Szókincs PRO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .then(reg => {
              console.log('✅ Service Worker ready')
              reg.update()
            })
            .catch(err => console.log('❌ SW error:', err))
        })
      }
    </script>
  </body>
</html>
